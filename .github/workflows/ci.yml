name: Continuous Integration

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Git dependencies pinned to the private pinax-network org (if any) need a
      # read token; the rewrite is scoped to that prefix so public fetches stay
      # anonymous. Unused when nothing is pinned there.
      - name: Configure git credentials for private crates
        run: git config --global url."https://x-access-token:${{ secrets.PAT_INTERNAL_REPOSITORIES }}@github.com/pinax-network/".insteadOf "https://github.com/pinax-network/"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev pkg-config libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check

  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Git dependencies pinned to the private pinax-network org (if any) need a
      # read token; the rewrite is scoped to that prefix so public fetches stay
      # anonymous. Unused when nothing is pinned there.
      - name: Configure git credentials for private crates
        run: git config --global url."https://x-access-token:${{ secrets.PAT_INTERNAL_REPOSITORIES }}@github.com/pinax-network/".insteadOf "https://github.com/pinax-network/"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev pkg-config libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all -- --test-threads=1

  udeps:
    name: udeps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Git dependencies pinned to the private pinax-network org (if any) need a
      # read token; the rewrite is scoped to that prefix so public fetches stay
      # anonymous. Unused when nothing is pinned there.
      - name: Configure git credentials for private crates
        run: git config --global url."https://x-access-token:${{ secrets.PAT_INTERNAL_REPOSITORIES }}@github.com/pinax-network/".insteadOf "https://github.com/pinax-network/"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev pkg-config libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-05-11
          components: rustfmt
          override: true
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-udeps
      - name: Run cargo udeps
        run: cargo +nightly-2026-05-11 udeps --workspace --lib --examples --tests --benches --all-features --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Git dependencies pinned to the private pinax-network org (if any) need a
      # read token; the rewrite is scoped to that prefix so public fetches stay
      # anonymous. Unused when nothing is pinned there.
      - name: Configure git credentials for private crates
        run: git config --global url."https://x-access-token:${{ secrets.PAT_INTERNAL_REPOSITORIES }}@github.com/pinax-network/".insteadOf "https://github.com/pinax-network/"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y liburing-dev pkg-config libclang-dev
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --tests --all-features
        env:
          RUSTFLAGS: "-D warnings"
